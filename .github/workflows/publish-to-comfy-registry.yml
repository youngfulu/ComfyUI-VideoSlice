# Publishes to https://registry.comfy.org/ when pyproject.toml changes on main.
# Repo secret: REGISTRY_ACCESS_TOKEN (Comfy Registry publishing key from registry.comfy.org/nodes).
# Your GitHub PAT used for `git push` must include the `workflow` scope to push this file.
name: Publish to Comfy Registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
