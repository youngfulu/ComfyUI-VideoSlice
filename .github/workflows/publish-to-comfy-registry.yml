# Auto-publish to Comfy Registry when pyproject.toml version changes on main.
# Uses: https://github.com/Comfy-Org/publish-node-action
#
# Setup (once):
# 1. Comfy Registry → create publisher + publishing API key (NOT a GitHub token).
# 2. GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#    Name: REGISTER_ACTION_COMFYUI
#    Value: ONLY the "Publishing" / API key from https://registry.comfy.org/nodes (publisher ftfftft).
#    If Actions log shows: Invalid personal access token — the secret is NOT a GitHub ghp_/github_pat_ token.
# 3. Bump [project].version in pyproject.toml when you want a new release; push to main.
#
# Git: pushing this file needs a GitHub PAT with `workflow` scope (or add via GitHub web UI).

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTER_ACTION_COMFYUI }}
