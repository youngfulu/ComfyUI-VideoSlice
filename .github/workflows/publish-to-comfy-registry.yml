# Publishes to https://registry.comfy.org/ when pyproject.toml version changes on main.
# Add repo secret REGISTRY_ACCESS_TOKEN (Comfy Registry publishing API key from registry.comfy.org/nodes).
name: Publish to Comfy Registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
