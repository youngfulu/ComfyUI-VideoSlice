[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ib-video-slicer"
version = "1.1.0"
description = "MP4/MOV to a single IMAGE frame — loop, random, skip-every-nth, frame counters (ib video slicer)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/youngfulu/ComfyUI-VideoSlice"
"Bug Tracker" = "https://github.com/youngfulu/ComfyUI-VideoSlice/issues"

[tool.comfy]
PublisherId = "ftfftft"
DisplayName = "ib video slicer"
