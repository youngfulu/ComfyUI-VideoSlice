[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ib-video-slicer"
version = "1.0.0"
description = "MP4/MOV to a single IMAGE frame — loop, random, skip-every-nth, frame counters (ib video slicer)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/ilyaduganov/ComfyUI-VideoSlice"
"Bug Tracker" = "https://github.com/ilyaduganov/ComfyUI-VideoSlice/issues"

[tool.comfy]
# Create a publisher at https://registry.comfy.org/ — your id is shown after @ on your profile.
PublisherId = "YOUR_PUBLISHER_ID"
DisplayName = "ib video slicer"
# Optional: square icon URL (max 400×400), e.g. raw GitHub URL to an icon.png in this repo
# Icon = "https://raw.githubusercontent.com/ilyaduganov/ComfyUI-VideoSlice/main/icon.png"
